name: Native newsvendor CI

on:
  push:
    branches: [main]
    paths:
      - "src/newsvendor_benchmark.py"
      - "tests/**"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "src/newsvendor_benchmark.py"
      - "tests/**"
      - ".github/workflows/native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newsvendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deterministic native-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<2" "pandas>=2.0,<2.2" "scikit-learn>=1.4,<1.7" "matplotlib>=3.7,<3.10" "pytest>=8,<10"
          python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Test decision-focused forecast and inventory logic
        run: python -m pytest -q tests/test_newsvendor_benchmark.py
      - name: Execute newsvendor benchmark end-to-end
        run: |
          python -m src.newsvendor_benchmark
          test -s artifacts/newsvendor_forecast_benchmark.csv
          test -s artifacts/newsvendor_forecast_predictions.csv
          test -s artifacts/newsvendor_forecast_benchmark.png
